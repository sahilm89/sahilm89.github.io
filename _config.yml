# Site -----------------------------------------------------------------------
title: Sahil Moza
tagline: Computational neuroscientist
thesis: How does a whole brain reconfigure when an animal learns?
variant: b          # b = distinctive editorial (chosen); a = plain cards
description: >-
  Sahil Moza is a computational neuroscientist and postdoctoral fellow in the Zhang Lab at
  Harvard University. He studies how learning reorganizes brain-wide neural dynamics in
  C. elegans and builds CeDNe, an open-source framework for multi-omic modeling of the nervous system.
url: https://www.sahilmoza.com
baseurl: ""
lang: en
timezone: America/New_York
author:
  name: Sahil Moza
  email: sahil.moza@gmail.com

profile:
  role: Postdoctoral Fellow
  lab: Zhang Lab
  lab_url: https://zhanglab.oeb.harvard.edu
  department: Department of Organismic and Evolutionary Biology
  institution: Harvard University
  institution_url: https://www.oeb.harvard.edu
  location: Cambridge, Massachusetts
  email: sahil.moza@gmail.com
  cv: /assets/pdf/SahilCV.pdf
  job_market: ""   # set to "" to hide

social:
  github: sahilm89
  orcid: 0000-0002-2225-8841
  scholar: hzfvStkAAAAJ
  linkedin: sahilmoza
  twitter: ""            # set to a handle to show an X/Twitter icon

nav:
  - { title: Research,     url: /research/ }
  - { title: Publications, url: /publications/ }
  - { title: Software,     url: /software/ }
  - { title: Teaching,     url: /teaching/ }
  - { title: CV,           url: /cv/ }

# Build ----------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty
include: [_pages]
exclude: [Gemfile, Gemfile.lock, README.md, LICENSE, bin, vendor, node_modules, _config_preview.yml]
defaults:
  - scope: { path: "" }
    values: { layout: page, image: /assets/img/portrait.jpg }

collections:
  research:
    output: true
    permalink: /research/:name/

plugins:
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-seo-tag

# Publications (jekyll-scholar) ----------------------------------------------
scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: bib
  sort_by: year, month
  order: descending
  query: "@*"
  replace_strings: true
  join_strings: true
  use_raw_bibtex_entry: true
  bibtex_filters: [latex, smallcaps, superscript]
