skills:
  - title: Modeling
    text: Large-scale simulation, dynamical systems, information theory, control-based system identification, chemical reaction network modeling, stochastic simulation (Langevin, Gillespie), optimization.
  - title: Analysis
    text: High-dimensional volumetric (4D) neural data, neural population geometry and manifold analysis, neural time-series modeling, connectome topology, tensor decomposition (SVD, CP, Tucker), graph-based learning, unsupervised learning and clustering.
  - title: Tools
    text: Python, PyTorch, JAX, scikit-learn, Optuna, NetworkX, NumPy, pandas, MOOSE, COPASI, Brian. UNIX, multiprocessing, SLURM and SGE clusters.
  - title: Experimental
    text: "*C. elegans* and *Drosophila melanogaster*: genetics, optogenetics, calcium imaging, behavior."
