# Builds the site with Jekyll and deploys it to GitHub Pages.
# Requires: repository Settings → Pages → Source = "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"   # 3.3+ drops racc (needed by bibtex-ruby) as a default gem; add gem "racc" before upgrading
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
